<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="t">
  <title id="t">honeykey</title>
  <defs>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#e08a00"/>
